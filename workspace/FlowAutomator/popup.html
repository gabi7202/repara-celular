<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --panel2: #23262e; --line: #31353f;
    --txt: #e8eaed; --mut: #9aa0a6; --acc: #f9ab00; --ok: #34a853; --err: #ea4335; --blue: #8ab4f8;
  }
  * { box-sizing: border-box; }
  body {
    width: 420px; margin: 0; padding: 14px; background: var(--bg); color: var(--txt);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px;
  }
  h1 { font-size: 15px; margin: 0 0 2px; display: flex; align-items: center; gap: 8px; }
  .sub { color: var(--mut); font-size: 11px; margin: 0 0 12px; }
  label { display: block; font-size: 11px; font-weight: 600; color: var(--mut); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .4px; }
  input, textarea, select {
    width: 100%; padding: 7px 9px; background: var(--panel2); color: var(--txt);
    border: 1px solid var(--line); border-radius: 6px; font-family: inherit; font-size: 12.5px;
  }
  textarea { height: 118px; resize: vertical; line-height: 1.45; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--acc); }
  .fila { display: flex; gap: 8px; }
  .fila > div { flex: 1; }
  .botones { display: flex; gap: 8px; margin-top: 12px; }
  button {
    flex: 1; padding: 9px 8px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--panel2); color: var(--txt); font-weight: 600; font-size: 12.5px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--acc); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primario { background: var(--acc); color: #1a1a1a; border-color: var(--acc); }
  button.peligro { background: #3a1f1f; border-color: #6b2b2b; color: #ffb4ab; }
  .barra { height: 6px; background: var(--panel2); border-radius: 4px; overflow: hidden; margin-top: 12px; }
  .barra > i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .3s; }
  #estado { margin-top: 8px; font-size: 12px; color: var(--blue); min-height: 16px; white-space: pre-wrap; }
  .lista { margin-top: 10px; max-height: 170px; overflow-y: auto; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
  .item { display: flex; gap: 8px; padding: 6px 9px; border-bottom: 1px solid var(--line); font-size: 11.5px; align-items: flex-start; }
  .item:last-child { border-bottom: none; }
  .item .n { color: var(--mut); min-width: 22px; font-variant-numeric: tabular-nums; }
  .item .p { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .s { min-width: 62px; text-align: right; color: var(--mut); }
  .ok { color: var(--ok); } .err { color: var(--err); } .run { color: var(--acc); }
  details { margin-top: 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
  summary { cursor: pointer; padding: 7px 9px; font-size: 11.5px; color: var(--mut); }
  pre { margin: 0; padding: 9px; font-size: 10.5px; line-height: 1.5; color: #cfd2d6; max-height: 190px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  .oculto { display: none; }
  a { color: var(--blue); }
  .hint { font-size: 10.5px; color: var(--mut); margin-top: 4px; line-height: 1.4; }
  .chk { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 11.5px; color: var(--mut); }
  .chk input { width: auto; }
</style>
</head>
<body>
  <h1>🍌 Flow Automator <span style="font-size:10px;color:var(--mut);font-weight:400">v2.0</span></h1>
  <p class="sub">Lote de imágenes en Google Flow · Nano Banana</p>

  <div id="alertaTab" class="hint err oculto"></div>

  <label for="prompts">Prompts (uno por línea)</label>
  <textarea id="prompts" placeholder="Un retrato cinematográfico de…&#10;Paisaje nocturno con lluvia neón…&#10;&#10;Tip: una línea que empiece con 2+ espacios continúa el prompt anterior."></textarea>
  <div class="fila" style="margin-top:8px">
    <button id="btnArchivo">📂 Cargar .txt</button>
    <button id="btnDiag">🔍 Diagnosticar página</button>
    <button id="btnLimpiar">🗑️</button>
  </div>

  <div class="fila">
    <div>
      <label for="carpeta">Carpeta (en Descargas)</label>
      <input type="text" id="carpeta" value="imagenes_flow">
    </div>
    <div style="max-width:110px">
      <label for="nombres">Nombres</label>
      <select id="nombres">
        <option value="slug" selected>Nº + prompt</option>
        <option value="numero">Solo número</option>
      </select>
    </div>
  </div>

  <div class="fila">
    <div>
      <label for="pausa">Pausa entre prompts (s)</label>
      <input type="number" id="pausa" value="4" min="0" max="120" step="1">
    </div>
    <div>
      <label for="timeout">Máx. por imagen (s)</label>
      <input type="number" id="timeout" value="150" min="20" max="600" step="10">
    </div>
  </div>

  <label class="chk"><input type="checkbox" id="nativo" checked> Intentar primero el botón de descarga de Flow</label>
  <label class="chk"><input type="checkbox" id="informe" checked> Guardar informe CSV + log en la carpeta</label>

  <div class="botones">
    <button id="btnIniciar" class="primario">🚀 Iniciar</button>
    <button id="btnParar" class="peligro oculto">⏹ Detener</button>
  </div>

  <div class="barra"><i id="barra"></i></div>
  <div id="estado">Listo. Abre flow.google.com y pulsa 🔍 Diagnosticar para verificar que detecta el campo.</div>
  <div class="lista oculto" id="lista"></div>

  <details>
    <summary>Registro / diagnóstico</summary>
    <pre id="log">—</pre>
  </details>

  <script src="popup.js"></script>
</body>
</html>
